name: Deploy Python Layer

on:
  push:
    branches:
      - master
      - dev
    paths:
      - python/serverless.yml
      - .github/workflows/python-deploy.yml

jobs:
  deploy:
    name: deploy python layer
    runs-on: ubuntu-latest
    if: ${{ ! contains(github.event.head_commit.message, '[skip-deploy]') }}
    container:
      image: ubuntu:22.04
    steps:
      - name: Install container tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            libbz2-dev \
            libffi-dev \
            liblzma-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            tk-dev \
            wget \
            xz-utils \
            zlib1g-dev
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install python
        run: |
          mkdir -p /opt/python
          wget https://www.python.org/ftp/python/$VERSION/Python-$VERSION.tgz
          tar zxfv Python-$VERSION.tgz
          cd Python-$VERSION
          ./configure --prefix=/opt/python
          make
          make altinstall
        env:
          VERSION: 3.9.5
      - name: Pre-compile
        run: /opt/python/bin/python3.9 -c 'import sys; print(sys.version)'
      - name: Determine env
        id: env
        run: |
          if [ $GITHUB_REF == 'refs/heads/master' ]; then
            echo 'stage=prod' >> "$GITHUB_OUTPUT"
          else
            echo 'stage=dev' >> "$GITHUB_OUTPUT"
          fi
      - name: Install serverless
        run: npm install -g serverless-cloud-framework
      - name: Deploy serverless base components
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          # Force deploy to fix permission problem
          scf deploy --force --target python | grep -v -e Initializing -e Uploading -e Deploying -e NA -e password
        env:
          STAGE: ${{ steps.env.outputs.stage }}
          SERVERLESS_PLATFORM_VENDOR: tencent
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
